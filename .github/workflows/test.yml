name: Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run full test suite
        env:
          LC_ALL: C.UTF-8
        run: |
          set -euo pipefail
          out="$(mktemp)"
          make test 2>&1 | tee "$out"

          scripts_count=$(git ls-files '*.sh' | wc -l | tr -d ' ')
          tests_passed=$(grep -c '✓ PASS' "$out" || true)
          tests_failed=$(grep -c '✗ FAIL' "$out" || true)
          tests_warned=$(grep -c '⚠ WARN' "$out" || true)

          {
            echo "## CI Test Summary"
            echo "- Shell scripts tracked: ${scripts_count}"
            echo "- PASS: ${tests_passed}"
            echo "- WARN: ${tests_warned}"
            echo "- FAIL: ${tests_failed}"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$tests_failed" != "0" ]]; then
            echo "One or more tests failed." >&2
            exit 1
          fi

      - name: Run quick smoke tests
        timeout-minutes: 5
        run: |
          set -euo pipefail
          make test-quick

      - name: Run bootstrap health check
        timeout-minutes: 2
        run: |
          set -euo pipefail
          bash scripts/checks/bootstrap_check.sh --output-dir /tmp/ci-check
